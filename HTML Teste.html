<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Técnico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #03588c;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            background-color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            padding: 20px;
        }

        .logo {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .logo img {
            max-width: 250px;
            padding: 40px;
        }

        #formTecnico {
            flex: 2;
            padding: 20px;
        }

        #formTecnico label {
            display: block;
            margin-bottom: 8px;
            font-weight: normal;
            color: #333333;
        }

        #formTecnico input[type="text"],
        #formTecnico input[type="date"],
        #formTecnico textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #formTecnico textarea {
            resize: vertical;
            height: 80px;
        }

        #formTecnico button {
            width: 100%;
            padding: 10px;
            background-color: #4ca633;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        #formTecnico button:hover {
            background-color: #025928;
        }

        #formTecnico input[type="checkbox"] {
            margin-bottom: 12px;
        }

        .message {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://web.celepar.pr.gov.br/drupal/images/detran/logo_detran_250x71.png" alt="Logo" />
        </div>
        <form id="formTecnico" onsubmit="handleSubmit(event)">
            <label for="dataAtendimento">Data de Atendimento:</label>
            <input type="date" id="dataAtendimento" name="dataAtendimento" required />

            <label for="chamados">Chamado(s):</label>
            <input type="text" id="chamados" name="chamados" required />

            <label for="solicitante">Grupo e Solicitante:</label>
            <input type="text" id="solicitante" name="Grupo e Solicitante" required />

            <label for="solicitacao">Solicitação:</label>
            <textarea id="solicitacao" name="solicitacao" required></textarea>

            <label for="atendente">Atendente:</label>
            <input type="text" id="atendente" name="atendente" required />

            <label for="observacoes">Observações:</label>
            <textarea id="observacoes" name="observacoes"></textarea>

            <label for="vinculado">Vinculado:</label>
            <input type="checkbox" id="vinculado" name="vinculado" />

            <button type="button" onclick="submitData()">Enviar</button>

            <div id="successMessage" class="message success">Dados enviados com sucesso.</div>
            <div id="errorMessage" class="message error"></div>
        </form>
    </div>

    <script>
        function showMessage(message, isSuccess) {
            const successMessage = document.getElementById("successMessage");
            const errorMessage = document.getElementById("errorMessage");

            if (isSuccess) {
                successMessage.style.display = "block";
                errorMessage.style.display = "none";
                successMessage.textContent = message;
            } else {
                errorMessage.style.display = "block";
                successMessage.style.display = "none";
                errorMessage.textContent = message;
            }

            setTimeout(() => {
                successMessage.style.display = "none";
                errorMessage.style.display = "none";
            }, 5000); // Mensagem some após 5 segundos
        }

        function formatDateToBrazilian(dateString) {
            const [year, month, day] = dateString.split("-");
            return `${day}/${month}/${year}`;
        }

        function submitData() {
            var form = document.getElementById("formTecnico");
            var data = {
                dataAtendimento: formatDateToBrazilian(form.dataAtendimento.value),
                chamados: form.chamados.value,
                solicitante: form.solicitante.value,
                solicitacao: form.solicitacao.value,
                atendente: form.atendente.value,
                observacoes: form.observacoes.value,
                vinculado: form.vinculado.checked
            };

            google.script.run
                .withSuccessHandler(() => {
                    showMessage("Dados enviados com sucesso.", true);
                    form.reset(); // Limpa os campos do formulário após o envio bem-sucedido
                })
                .withFailureHandler((error) => {
                    showMessage("Erro ao enviar dados: " + error.message, false);
                })
                .submitFormCt(data);
        }
    </script>
</body>

</html>
